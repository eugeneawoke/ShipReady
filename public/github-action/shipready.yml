# public/github-action/shipready.yml
# ShipReady CI Score Check
# Copy this file to .github/workflows/shipready.yml in your repo.
# Requires: SHIPREADY_API_KEY secret in your repo settings (Agency plan key).
# Optional: set DEPLOYMENT_URL env var before this job runs (e.g. from Vercel preview URL).

name: ShipReady Score Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  shipready:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Submit scan
        id: scan
        env:
          API_KEY: ${{ secrets.SHIPREADY_API_KEY }}
          BASE_URL: ${{ vars.SHIPREADY_BASE_URL || 'https://shipready.app' }}
          DEPLOYMENT_URL: ${{ env.DEPLOYMENT_URL || github.event.pull_request.head.repo.html_url }}
          FAIL_THRESHOLD: ${{ vars.SHIPREADY_FAIL_THRESHOLD || '70' }}
        run: |
          set -e
          echo "Scanning: $DEPLOYMENT_URL"
          RESPONSE=$(curl -sf -X POST "$BASE_URL/api/v1/scan" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"$DEPLOYMENT_URL\", \"goal\": \"full\"}")
          SCAN_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "fail_threshold=$FAIL_THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "Scan ID: $SCAN_ID"

      - name: Poll for results
        id: result
        env:
          API_KEY: ${{ secrets.SHIPREADY_API_KEY }}
          BASE_URL: ${{ steps.scan.outputs.base_url }}
          SCAN_ID: ${{ steps.scan.outputs.scan_id }}
        run: |
          set -e
          ATTEMPTS=0
          MAX_ATTEMPTS=40   # 40 × 15s = 600s timeout
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            sleep 15
            ATTEMPTS=$((ATTEMPTS + 1))
            RESULT=$(curl -sf "$BASE_URL/api/scan/$SCAN_ID" \
              -H "Authorization: Bearer $API_KEY" || echo '{"status":"error"}')
            STATUS=$(echo "$RESULT" | jq -r '.status // "error"')
            echo "Attempt $ATTEMPTS: status=$STATUS"
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "error" ]; then
              # Write result to file (avoids env size limits)
              echo "$RESULT" > /tmp/scan_result.json
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo "status=timeout" >> "$GITHUB_OUTPUT"
            echo '{"status":"timeout"}' > /tmp/scan_result.json
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs')
            const raw = fs.readFileSync('/tmp/scan_result.json', 'utf8')
            const data = JSON.parse(raw)
            const status = data.status
            const threshold = parseInt(process.env.FAIL_THRESHOLD || '70')

            if (status === 'timeout') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⏳ **ShipReady**: Scan timed out after 10 minutes. Check [ShipReady](https://shipready.app) directly.',
              })
              return
            }
            if (status === 'error') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ **ShipReady**: Scan failed. Review scanner logs or try re-running.',
              })
              return
            }

            const r = data.results || {}
            const score = r.totalScore ?? 0
            const emoji = score >= threshold ? '✅' : '❌'
            const cats = ['performance', 'seo', 'security', 'mobile', 'ai_visibility', 'accessibility']
            const rows = cats.map(cat => {
              const s = r[cat]?.score
              const label = s !== null && s !== undefined ? s : 'N/A'
              return `| ${cat.replace('_', ' ')} | ${label} |`
            }).join('\n')

            const body = [
              `## ShipReady Score: **${score}/100** ${emoji}`,
              '',
              `| Category | Score |`,
              `|---|---|`,
              rows,
              '',
              score < threshold
                ? `⚠️ Score **${score}** is below threshold **${threshold}**. Fix the issues above before merging.`
                : `🚀 Score meets the threshold of ${threshold}.`,
              '',
              `[View full report](${data.results?.url ? 'https://shipready.app' : 'https://shipready.app'})`,
            ].join('\n')

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
        env:
          FAIL_THRESHOLD: ${{ steps.scan.outputs.fail_threshold }}

      - name: Enforce score threshold
        env:
          SCAN_STATUS: ${{ steps.result.outputs.status }}
          FAIL_THRESHOLD: ${{ steps.scan.outputs.fail_threshold }}
        run: |
          if [ "$SCAN_STATUS" = "timeout" ] || [ "$SCAN_STATUS" = "error" ]; then
            echo "Scan did not complete successfully — failing CI."
            exit 1
          fi
          SCORE=$(jq -r '.results.totalScore // 0' /tmp/scan_result.json)
          echo "Final score: $SCORE / threshold: $FAIL_THRESHOLD"
          if [ "$SCORE" -lt "$FAIL_THRESHOLD" ]; then
            echo "Score $SCORE is below threshold $FAIL_THRESHOLD — failing PR."
            exit 1
          fi
          echo "Score $SCORE meets threshold. PR passes."
