<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 52" fill="none">
  <defs>
    <linearGradient id="ship-g" x1="0" y1="0" x2="64" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6E56CF"/>
      <stop offset="100%" stop-color="#3DDC84"/>
    </linearGradient>
  </defs>
  <!-- Hull -->
  <path d="M4 34 L4 40 Q4 44 9 44 L55 44 Q60 44 60 40 L60 34 Z" fill="url(#ship-g)"/>
  <!-- Deck -->
  <rect x="4" y="31" width="56" height="5" fill="url(#ship-g)"/>
  <!-- Bridge / cabin -->
  <rect x="6" y="19" width="13" height="13" rx="1.5" fill="url(#ship-g)"/>
  <!-- Containers stacked (center) -->
  <rect x="21" y="24" width="11" height="8" rx="1" fill="url(#ship-g)"/>
  <rect x="21" y="16" width="11" height="9" rx="1" fill="url(#ship-g)"/>
  <!-- Right containers -->
  <rect x="34" y="26" width="9" height="6" rx="1" fill="url(#ship-g)"/>
  <rect x="45" y="27" width="13" height="5" rx="1" fill="url(#ship-g)"/>
  <!-- Chimney -->
  <rect x="12" y="10" width="5" height="11" rx="1.5" fill="url(#ship-g)"/>
  <!-- Steam puffs -->
  <circle cx="20" cy="10" r="3" fill="#E8E6FF" fill-opacity="0.55"/>
  <circle cx="25" cy="7"  r="2.2" fill="#E8E6FF" fill-opacity="0.38"/>
  <circle cx="29" cy="4.5" r="1.5" fill="#E8E6FF" fill-opacity="0.22"/>
</svg>
